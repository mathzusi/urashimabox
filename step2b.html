<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<script src="common.js"></script>

<title>STEP2</title>

</head>

<body>

<div id="fogLeft"></div>
<div id="fogRight"></div>

<div id="smoke-container"></div>

<div id="memoryPanel"></div>

<div id="ground"></div>

<img
    src="ryuuguujyou.png"
    id="ryugujo"
    alt="竜宮城">

<h1>STEP2</h1>

<!-- 記憶ポップアップ -->

<div id="memoryViewer" class="modal hidden">

    <div class="modalContent">

        <h2 id="viewerTitle"></h2>

        <p id="viewerText"></p>

        <img
            id="viewerImage"
            class="hidden"
            src=""
            style="
                max-width:250px;
                margin-top:15px;
                border-radius:10px;
            ">

        <button onclick="closeMemoryViewer()">
            閉じる
        </button>

    </div>

</div>

<div id="story">

    「約束を...破ってしまったのですね...。」<br>
    オトヒメは悲しそうに言った。<br>
    ただ、想像していたよりあまり気にしていないようにも見えた。<br>
    「さあ、次の謎はこちらです。」

</div>

<br><br>

<h2>まずは1〜4を解き、5の答えを導こう。</h2><br>

    <h2>
        乙姫との約束：
    <br>
        「ウラシマと海の生物以外の生物を無視すること」
    </h2>

<input id="answer">

<button onclick="check()">
解答
</button>

<p id="result"></p>

<script>

function check(){

    const ans =
        document
        .getElementById("answer")
        .value
        .trim();

    if(
        ans === "いこく"||
        ans === "イコク"||
        ans === "異国"||
        ans === "いらく"||
        ans === "イラク"
    ){

        document
            .getElementById("result")
            .innerHTML =
            "1正解";

        return;

    }

    if(
        ans === "くぶん"||
        ans === "クブン"||
        ans === "区分"||
        ans === "ちたん"||
        ans === "チタン"
    ){

        document
            .getElementById("result")
            .innerHTML =
            "2正解";

        return;

    }

    if(
        ans === "こらい"||
        ans === "コライ"||
        ans === "古来"||
        ans === "らんち"||
        ans === "ランチ"
    ){

        document
            .getElementById("result")
            .innerHTML =
            "3正解";
    
        return;

    }

    if(
        ans === "ちくわ"||
        ans === "チクワ"||
        ans === "たいわ"||
        ans === "タイワ"||
        ans === "対話"
    ){

        document
            .getElementById("result")
            .innerHTML =
            "4正解";

        return;

    }

    // E1
    if(
        ans === "こぶら"||
        ans === "コブラ"||
        ans === "くらぶ"||
        ans === "クラブ"
    ){

        unlockMemory(2);

        nextPage = "step3a.html";

        return;
    }

    // E2
    if(
        ans === "らいん"||
        ans === "ライン"||
        ans === "たんい"||
        ans === "タンイ"||
        ans === "単位"
    ){

        createSmoke();

        setTimeout(()=>{

            location.href =
            "step3b.html";

        },2000);

        return;
    }
    
    
    else{

        document
            .getElementById("result")
            .innerHTML =
            "不正解";

    }

}


</script>

</body>
</html>
